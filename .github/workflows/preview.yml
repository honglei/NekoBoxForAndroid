name: Preview Build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: app/libs/libcore.aar
          key: ${{ runner.os }}-libcore-${{ hashFiles('run', 'buildScript/init/env.sh', 'buildScript/lib/core.sh', 'buildScript/lib/core/**', 'libcore/**') }}
      - name: Set up Java
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25.11'
          cache-dependency-path: libcore/go.sum
      - name: Set up Android SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v4.0.1
      - name: Install Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: sdkmanager 'ndk;29.0.14206865'
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore
        uses: actions/upload-artifact@v7.0.1
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Download LibCore
        uses: actions/download-artifact@v8.0.1
        with:
          name: libcore-aar
          path: app/libs
      - name: Set up Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.1.0'
      - name: Restore signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > release.keystore
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          EXPECTED_CERT_SHA256: 7EDA9F088098B9EA10940918B30B541B4C297BDC80ED6093DB55DF5C25AC8DF7
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          ARM64_APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' -print -quit)
          test -n "$ARM64_APK"
          "${ANDROID_HOME}/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$ARM64_APK"
          CERT_SHA256=$("${ANDROID_HOME}/build-tools/36.1.0/apksigner" verify --print-certs "$ARM64_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "${CERT_SHA256^^}" = "$EXPECTED_CERT_SHA256"
          APK_DIR=$(dirname "$ARM64_APK")
          find "$APK_DIR" -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > "$APK_DIR/SHA256SUMS.txt"
          echo "APK=$APK_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: APKs
          path: ${{ env.APK }}
  android-13:
    name: Android 13 Install and Launch
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Download APKs
        uses: actions/download-artifact@v8.0.1
        with:
          name: APKs
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify on Android 13
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            APK=$(find artifacts -name '*x86_64*.apk' -print -quit) &&
            test -n "$APK" &&
            adb install "$APK" &&
            adb shell am start -W -n moe.nb4a/io.nekohasekai.sagernet.ui.MainActivity &&
            sleep 5 &&
            adb shell pidof moe.nb4a &&
            adb shell dumpsys package moe.nb4a | grep -E 'versionName|targetSdk'
